<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanatorio UNDAV - Acceso Personal de Salud</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0;
      background: #f0f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #1e293b;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 430px;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border-top: 5px solid #0284c7;
    }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .header h1 { margin: 0; font-size: 1.5rem; color: #0f172a; }
    .header p { margin: 0.3rem 0 0; font-size: 0.9rem; color: #64748b; }
    .form-group { margin-bottom: 1.1rem; }
    label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.4rem; }
    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.95rem;
    }
    input:focus { outline: none; border-color: #0284c7; box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15); }
    button {
      width: 100%;
      padding: 0.75rem;
      background: #0284c7;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #0369a1; }
    .error {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 0.7rem;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      border: 1px solid #fecaca;
    }
    .dashboard { display: none; }
    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
    }
    .modulos { list-style: none; padding: 0; margin: 1rem 0; }
    .modulos li {
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .permitido { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }
    .restringido { background: #f8fafc; color: #94a3b8; border: 1px solid #e2e8f0; text-decoration: line-through; }
    .btn-logout { background: #475569; margin-top: 0.5rem; }
    .btn-logout:hover { background: #334155; }
    .ayuda {
      margin-top: 1.2rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      font-size: 0.78rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <!-- VISTA 1: LOGIN (SU-36) -->
  <div class="card" id="vista-login">
    <div class="header">
      <h1>Sanatorio UNDAV1</h1>
      <p>Portal de Personal de Salud</p>
    </div>

    <div class="error" id="mensaje-error"></div>

    <form id="form-login">
      <div class="form-group">
        <label for="email">Correo institucional</label>
        <input type="email" id="email" placeholder="ej. medico@undav.edu.ar" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Iniciar sesión</button>
    </form>

    <div class="ayuda">
      <strong>Usuarios de prueba (clave: 1234):</strong><br />
      admision@undav.edu.ar | triage@undav.edu.ar | medico@undav.edu.ar | jefe@undav.edu.ar | admin.consultorios@undav.edu.ar | ti@undav.edu.ar
    </div>
  </div>

  <!-- VISTA 2: ENTORNO SEGÚN ROL (Cumple Criterios de Aceptación SU-4) -->
  <div class="card dashboard" id="vista-panel">
    <span class="badge" id="rol-usuario"></span>
    <h2 id="bienvenida" style="margin: 0 0 0.3rem; font-size: 1.25rem;"></h2>
    <p style="margin: 0; font-size: 0.85rem; color: #64748b;">Control de acceso por perfil operativo:</p>

    <ul class="modulos" id="lista-modulos"></ul>

    <button class="btn-logout" id="btn-salir">Cerrar sesión</button>
  </div>

  <script>
    // Todos los módulos del sistema para demostrar restricción de roles (SU-4)
    const TODOS_LOS_MODULOS = [
      "Registro de Guardia",
      "Registro de Parámetros Fisiológicos",
      "Clasificación Triage",
      "Atención de Guardia",
      "Historia Clínica",
      "Tablero de Control en Tiempo Real",
      "Autorización de Derivaciones",
      "Validación de Órdenes Médicas",
      "Alta de Profesionales",
      "Reglas CIE-10"
    ];

    // Respaldo local por si se abre el HTML directo sin servidor local
    const BACKUP_USUARIOS = [
      { nombre: "Laura Gómez", email: "admision@undav.edu.ar", password: "1234", rol: "Admisión", pantallas_permitidas: ["Registro de Guardia"] },
      { nombre: "Carlos Méndez", email: "triage@undav.edu.ar", password: "1234", rol: "Triage", pantallas_permitidas: ["Registro de Parámetros Fisiológicos", "Clasificación Triage"] },
      { nombre: "Dra. Sofía Martínez", email: "medico@undav.edu.ar", password: "1234", rol: "Médico", pantallas_permitidas: ["Atención de Guardia", "Historia Clínica"] },
      { nombre: "Dr. Roberto Silva", email: "jefe@undav.edu.ar", password: "1234", rol: "Jefe de Guardia", pantallas_permitidas: ["Tablero de Control en Tiempo Real", "Autorización de Derivaciones"] },
      { nombre: "Mariana Torres", email: "admin.consultorios@undav.edu.ar", password: "1234", rol: "Administrativo", pantallas_permitidas: ["Validación de Órdenes Médicas"] },
      { nombre: "Juan Pizzorno", email: "ti@undav.edu.ar", password: "1234", rol: "TI", pantallas_permitidas: ["Alta de Profesionales", "Reglas CIE-10"] }
    ];

    async function obtenerUsuarios() {
      try {
        const resp = await fetch('./usuarios.json');
        if (!resp.ok) throw new Error('No se pudo leer el JSON externo');
        return await resp.json();
      } catch (e) {
        return BACKUP_USUARIOS;
      }
    }

    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('mensaje-error');

      const usuarios = await obtenerUsuarios();
      const usuarioValido = usuarios.find(u => u.email.toLowerCase() === email && u.password === password);

      if (!usuarioValido) {
        errorBox.textContent = 'Credenciales inválidas. Verifique su correo y contraseña.';
        errorBox.style.display = 'block';
        return;
      }

      errorBox.style.display = 'none';
      mostrarPanelRol(usuarioValido);
    });

    function mostrarPanelRol(usuario) {
      document.getElementById('vista-login').style.display = 'none';
      document.getElementById('vista-panel').style.display = 'block';

      document.getElementById('rol-usuario').textContent = `Perfil: ${usuario.rol}`;
      document.getElementById('bienvenida').textContent = `Hola, ${usuario.nombre}`;

      const lista = document.getElementById('lista-modulos');
      lista.innerHTML = '';

      TODOS_LOS_MODULOS.forEach(modulo => {
        const li = document.createElement('li');
        const tieneAcceso = usuario.pantallas_permitidas.includes(modulo);
        li.className = tieneAcceso ? 'permitido' : 'restringido';
        li.innerHTML = `<span>${modulo}</span> <strong>${tieneAcceso ? 'Habilitado' : 'Bloqueado'}</strong>`;
        lista.appendChild(li);
      });
    }

    document.getElementById('btn-salir').addEventListener('click', () => {
      document.getElementById('form-login').reset();
      document.getElementById('vista-panel').style.display = 'none';
      document.getElementById('vista-login').style.display = 'block';
    });
  </script>
</body>
</html>
