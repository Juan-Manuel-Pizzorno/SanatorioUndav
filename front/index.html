<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sanatorio UNDAV | Sistema Integral de Gestión Hospitalaria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0369a1;
      --primary-dark: #0c4a6e;
      --primary-light: #e0f2fe;
      --accent: #0d9488;
      --bg-page: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --danger-bg: #fef2f2;
      --danger-text: #b91c1c;
      --danger-border: #fecaca;
      --success-bg: #f0fdf4;
      --success-text: #15803d;
      --success-border: #bbf7d0;
    }

    * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      margin: 0;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    /* ================= VISTA LOGIN (SPLIT SCREEN) ================= */
    .login-wrapper {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      width: 100%;
      max-width: 920px;
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.12);
      border: 1px solid var(--border);
    }

    .brand-panel {
      background: linear-gradient(155deg, #0c4a6e 0%, #0369a1 55%, #0d9488 100%);
      color: #ffffff;
      padding: 2.75rem 2.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-logo h2 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-logo span {
      display: block;
      font-size: 0.75rem;
      opacity: 0.85;
      font-weight: 400;
    }

    .brand-copy {
      margin: 2rem 0;
    }

    .brand-copy h1 {
      font-size: 1.65rem;
      line-height: 1.25;
      margin: 0 0 0.85rem;
      font-weight: 700;
    }

    .brand-copy p {
      font-size: 0.9rem;
      line-height: 1.55;
      opacity: 0.9;
      margin: 0;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.28);
      padding: 0.45rem 0.85rem;
      border-radius: 999px;
      font-size: 0.78rem;
      width: fit-content;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.25);
    }

    .form-panel {
      padding: 2.75rem 2.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .form-header {
      margin-bottom: 1.75rem;
    }

    .form-header h3 {
      margin: 0 0 0.35rem;
      font-size: 1.35rem;
      color: var(--text-main);
    }

    .form-header p {
      margin: 0;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 0.85rem;
      color: #94a3b8;
      pointer-events: none;
      display: flex;
    }

    input {
      width: 100%;
      padding: 0.72rem 0.9rem 0.72rem 2.5rem;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font-size: 0.92rem;
      color: var(--text-main);
      transition: all 0.18s ease;
      background: #f8fafc;
    }

    input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.14);
    }

    .toggle-pass {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      padding: 0.25rem;
      width: auto;
      display: flex;
      align-items: center;
    }

    .toggle-pass:hover {
      color: var(--primary);
      background: none;
    }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 9px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.1s ease;
      margin-top: 0.35rem;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
    }

    .btn-primary:active {
      transform: scale(0.99);
    }

    .error-banner {
      display: none;
      align-items: center;
      gap: 0.6rem;
      background: var(--danger-bg);
      color: var(--danger-text);
      border: 1px solid var(--danger-border);
      padding: 0.75rem 0.9rem;
      border-radius: 9px;
      font-size: 0.84rem;
      margin-bottom: 1.15rem;
    }

    .qa-box {
      margin-top: 1.65rem;
      padding-top: 1.15rem;
      border-top: 1px solid var(--border);
    }

    .qa-title {
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
      display: block;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .chip {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #334155;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      width: auto;
      transition: all 0.15s ease;
    }

    .chip:hover {
      background: var(--primary-light);
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    /* ================= VISTA PANEL POST-LOGIN ================= */
    .dashboard-wrapper {
      display: none;
      width: 100%;
      max-width: 860px;
      background: var(--surface);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px -15px rgba(15, 23
