<script type="module">
    import {
      TODOS_LOS_MODULOS,
      iniciarSesion,
      tieneAccesoModulo,
      obtenerSesionActiva,
      cerrarSesion
    } from '../back/auth.js';

    // Si ya había una sesión iniciada al recargar la página, mantiene el acceso
    window.addEventListener('DOMContentLoaded', () => {
      const sesionGuardada = obtenerSesionActiva();
      if (sesionGuardada) {
        mostrarPanelRol(sesionGuardada);
      }
    });

    // Mostrar / ocultar contraseña
    document.getElementById('btn-toggle-pass').addEventListener('click', () => {
      const passInput = document.getElementById('password');
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    });

    // Botones rápidos de prueba para QA
    document.querySelectorAll('.chip').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('email').value = btn.dataset.email;
        document.getElementById('password').value = '1234';
        document.getElementById('mensaje-error').style.display = 'none';
      });
    });

    // Envío del formulario llamando al backend (auth.js)
    document.getElementById('form-login').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('mensaje-error');

      const resultado = await iniciarSesion(email, password);

      if (!resultado.ok) {
        document.getElementById('texto-error').textContent = resultado.mensaje;
        errorBox.style.display = 'flex';
        return;
      }

      errorBox.style.display = 'none';
      mostrarPanelRol(resultado.usuario);
    });

    function mostrarPanelRol(usuario) {
      document.getElementById('vista-login').style.display = 'none';
      document.getElementById('vista-panel').style.display = 'block';

      const iniciales = usuario.nombre.split(' ').map(n => n[0]).join('').slice(0, 2).toUpperCase();
      document.getElementById('avatar-iniciales').textContent = iniciales;
      document.getElementById('bienvenida').textContent = usuario.nombre;
      document.getElementById('rol-usuario').textContent = `Perfil: ${usuario.rol}`;
      document.getElementById('matricula-usuario').textContent = usuario.matricula ? `Matrícula: ${usuario.matricula}` : '';

      const grid = document.getElementById('lista-modulos');
      grid.innerHTML = '';

      TODOS_LOS_MODULOS.forEach(modulo => {
        const permitido = tieneAccesoModulo(usuario, modulo);
        const card = document.createElement('div');
        card.className = `mod-card ${permitido ? 'allowed' : 'denied'}`;
        card.innerHTML = `
          <div class="mod-title">${modulo}</div>
          <div class="mod-status">
            ${permitido ? '✓ Acceso habilitado' : '✕ Restringido por rol'}
          </div>
        `;
        grid.appendChild(card);
      });
    }

    document.getElementById('btn-salir').addEventListener('click', () => {
      cerrarSesion();
      document.getElementById('form-login').reset();
      document.getElementById('password').type = 'password';
      document.getElementById('vista-panel').style.display = 'none';
      document.getElementById('vista-login').style.display = 'grid';
    });
  </script>
